<!doctype html><html lang="zh"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; worker-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><meta charset="utf-8"><title>离线任务清单</title><style>body{font:18px system-ui;max-width:700px;margin:40px auto;padding:24px;color:#17212c}input,button{font:inherit;padding:12px}li{margin:18px 0}#notice{background:#fff6da;padding:12px}.done{text-decoration:line-through}output{padding:8px}</style></head><body><h1>修复受控待办板演示模板的空任务问题：空字符串或纯空格不能新增任务，连续添加两个不同任务必须恰好产生两条，删除其中一条不影响另一条，统计正确。仅交付单 HTML。</h1><p id="notice">工程 Mock 夹具，不是真实模型自主交付。</p><label for="task-input">任务名称</label><input id="task-input" maxlength="120"><button id="add-task">添加</button><p id="feedback">请输入任务</p><button id="show-all">全部</button><button id="show-open">未完成</button><button id="show-done">已完成</button><ul id="tasks"></ul><p>任务数量 <output id="count">0</output> 完成数量 <output id="done-count">0</output></p><script>const tasks=[];let filter='all';let nextId=0;const input=document.querySelector('#task-input');const feedback=document.querySelector('#feedback');function render(){const list=document.querySelector('#tasks');list.replaceChildren();tasks.forEach(task=>{if(filter==='open'&&task.done||filter==='done'&&!task.done)return;const li=document.createElement('li');li.dataset.taskId=String(task.id);const span=document.createElement('span');span.textContent=task.title;span.className=task.done?'done':'';const button=document.createElement('button');button.className='toggle';button.textContent=task.done?'恢复':'完成';button.onclick=()=>{task.done=!task.done;render()};const remove=document.createElement('button');remove.className='delete';remove.textContent='删除';remove.onclick=()=>{tasks.splice(tasks.findIndex(item=>item.id===task.id),1);render()};li.append(span,button,remove);list.append(li)});document.querySelector('#count').textContent=String(tasks.length);document.querySelector('#done-count').textContent=String(tasks.filter(task=>task.done).length)}document.querySelector('#add-task').onclick=()=>{const title=input.value.trim();if(!title){feedback.textContent='任务不能为空';return}tasks.push({id:nextId++,title,done:false});input.value='';feedback.textContent='已添加';render()};document.querySelector('#show-all').onclick=()=>{filter='all';render()};document.querySelector('#show-open').onclick=()=>{filter='open';render()};document.querySelector('#show-done').onclick=()=>{filter='done';render()};render();</script></body></html>
